<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoFridge - Gestion Ecologica de Alimentos</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <!-- Encabezado -->
  <header class="bg-success text-white p-4">
    <div class="container">
      <h1 class="display-4">EcoFridge</h1>
      <p class="lead">Gestiona tus alimentos de forma ecologica y sostenible</p>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="container my-5">
    <!-- Mashup API de recetas insertado antes del contacto -->
    <section id="recetas" class="mb-5">
      <h2>¿Qué cocino con lo que tengo?</h2>
      <div class="mb-3">
        <label for="ingredientes" class="form-label">Escribe tus ingredientes (separados por comas):</label>
        <input type="text" id="ingredientes" class="form-control" placeholder="ej: tomate, arroz, cebolla" />
      </div>
      <button id="buscarRecetas" class="btn btn-success">Buscar Recetas</button>
      <div id="resultadoRecetas" class="mt-4"></div>
    </section>

    <!-- Formulario de contacto -->
    <section id="contact" class="mb-5">
      <h2>Contactanos</h2>
      <form action="envio_formulario.php" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre:</label>
          <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required autofocus>
          <div class="invalid-feedback">
            Por favor, ingresa tu nombre.
          </div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electronico:</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" required autocomplete="email">
          <div class="invalid-feedback">
            Ingresa un correo electronico valido.
          </div>
        </div>
        <div class="mb-3">
          <label for="fecha" class="form-label">Fecha de contacto:</label>
          <input type="date" class="form-control" id="fecha" name="fecha" required>
          <div class="invalid-feedback">
            Selecciona una fecha.
          </div>
        </div>
        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje:</label>
          <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aqui" required></textarea>
          <div class="invalid-feedback">
            Por favor, ingresa un mensaje.
          </div>
        </div>
        <button class="btn btn-primary" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <!-- Pie de pagina -->
  <footer class="bg-dark text-white p-4 text-center">
    <div class="container">
      <p>&copy; 2025 EcoFridge. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Mashup Script -->
  <script>
    document.getElementById('buscarRecetas').addEventListener('click', function () {
      const ingredientes = document.getElementById('ingredientes').value.trim();
      const apiKey = "TU_API_KEY"; // Reemplaza por tu clave real de Spoonacular

      if (!ingredientes) {
        alert("Por favor, escribe al menos un ingrediente.");
        return;
      }

      fetch(`https://api.spoonacular.com/recipes/findByIngredients?ingredients=${ingredientes}&number=3&apiKey=${apiKey}`)
        .then(response => response.json())
        .then(data => {
          const contenedor = document.getElementById('resultadoRecetas');
          contenedor.innerHTML = "";

          if (data.length === 0) {
            contenedor.innerHTML = "<p>No se encontraron recetas.</p>";
            return;
          }

          data.forEach(receta => {
            const card = document.createElement('div');
            card.className = "card mb-3";
            card.innerHTML = `
              <div class="row g-0">
                <div class="col-md-4">
                  <img src="${receta.image}" class="img-fluid rounded-start" alt="${receta.title}">
                </div>
                <div class="col-md-8">
                  <div class="card-body">
                    <h5 class="card-title">${receta.title}</h5>
                    <p class="card-text">ID de receta: ${receta.id}</p>
                    <a href="https://spoonacular.com/recipes/${receta.title.toLowerCase().replaceAll(' ', '-')}-${receta.id}" class="btn btn-outline-success" target="_blank">Ver receta</a>
                  </div>
                </div>
              </div>
            `;
            contenedor.appendChild(card);
          });
        })
        .catch(error => {
          console.error("Error al buscar recetas:", error);
          document.getElementById('resultadoRecetas').innerHTML = "<p>Error al obtener las recetas.</p>";
        });
    });
  </script>
</body>
</html>
